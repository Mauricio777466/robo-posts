name: Vídeos MS Tech

on:
  push:
    branches: [mstech-videos]
    paths: ['mstech/**', '.github/workflows/mstech-videos.yml']
  workflow_dispatch:
    inputs:
      inicio:
        description: 'Primeiro dia (AAAA-MM-DD)'
        default: '2026-10-29'
      dias:
        description: 'Quantos dias'
        default: '15'

permissions:
  contents: write

concurrency:
  group: mstech-videos
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -q pillow imageio-ffmpeg "edge-tts>=7.3.1"

      - name: Gerar os vídeos do calendário (com voz)
        working-directory: mstech
        run: |
          python -m roteiros_reels.calendario \
            --inicio "${{ inputs.inicio || '2026-10-29' }}" \
            --dias "${{ inputs.dias || '15' }}" \
            --saida ../docs/mstech --exigir-voz

      - name: Salvar os vídeos no repositório (link público)
        run: |
          git config user.name "robo-posts"
          git config user.email "robo-posts@users.noreply.github.com"
          git add docs/mstech mstech/dados
          git diff --cached --quiet || git commit -m "Vídeos MS Tech: $(date -u +%F)"
          git push
